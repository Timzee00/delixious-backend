[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.19.0"
  NPM_FLAGS = "--include=dev"

# Keep browser API requests same-origin. Netlify proxies them to Render,
# avoiding third-party cookie restrictions that can break authentication in
# stricter browsers.
[[redirects]]
  from = "/api/*"
  to = "https://delixious-backend.onrender.com/api/:splat"
  status = 200
  force = true

# React Router SPA fallback. This must remain after the API proxy so /api/*
# is never swallowed by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
